<!DOCTYPE html>
<html>
<head>
    <title>Shattered Pixel Dungeon</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ccc;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
<div id="loading">Loading Shattered Pixel Dungeon&hellip;</div>
<!-- GWT bootstrap script; 'html' matches rename-to="html" in GdxDefinition.gwt.xml -->
<script src="html/html.nocache.js"></script>
</body>
</html>
